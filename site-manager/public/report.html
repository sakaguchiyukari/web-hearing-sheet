<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Webサイト管理状況報告書</title>
  <link rel="icon" href="assets/img/favicon-site-manager.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="assets/js/report-page.js" defer></script>
</head>
<body class="report-body">

  <!-- ===== 操作バー（印刷時は非表示） ===== -->
  <div class="report-toolbar no-print">
    <p class="report-toolbar__title" id="report-title">報告書を読み込み中…</p>
    <div class="report-toolbar__actions">
      <button type="button" class="btn btn--primary btn--sm" id="print-button">印刷 / PDFで保存</button>
      <button type="button" class="btn btn--outline btn--sm" id="csv-button">CSV出力</button>
      <a class="btn btn--outline btn--sm" href="/#/reports">管理画面に戻る</a>
    </div>
  </div>

  <!-- ===== 報告書本体 ===== -->
  <main class="report-sheet-wrap" id="report-root"></main>

</body>
</html>
